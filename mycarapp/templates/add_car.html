{% extends "base.html" %}

{% block content %}
<h2 class="text-2xl font-bold mb-4">Add a New Vehicle</h2>
<form action="{{ url_for('add_car') }}" method="POST" enctype="multipart/form-data" class="space-y-4 max-w-md">
    
    <div>
        <label class="block font-medium">Vehicle Type:</label>
        <select name="vehicle_type" class="border p-2 w-full rounded" required>
            <option value="">Select Type</option>
            <option value="Car">Car</option>
            <option value="Truck">Truck</option>
            <option value="Motorcycle">Motorcycle</option>
            <option value="Boat">Boat</option>
            <option value="RV">RV</option>
        </select>
    </div>

    <div>
        <label class="block font-medium">Make:</label>
        <input type="text" name="make" class="border p-2 w-full rounded" required>
    </div>
    <div>
        <label class="block font-medium">Model:</label>
        <input type="text" name="model" class="border p-2 w-full rounded" required>
    </div>
    <div>
        <label class="block font-medium">Year:</label>
        <input type="number" name="year" class="border p-2 w-full rounded" required>
    </div>
    <div>
        <label class="block font-medium">VIN Number (optional):</label>
        <input type="text" name="vin" class="border p-2 w-full rounded" placeholder="e.g., 1HGCM82633A123456">
    </div>
    <div>
        <label class="block font-medium">Miles When Purchased (optional):</label>
        <input type="number" name="purchase_mileage" class="border p-2 w-full rounded" step="0.1" placeholder="e.g., 25000">
    </div>
    <div id="purchase_hours_field" style="display: none;">
        <label class="block font-medium">Hours When Purchased (optional):</label>
        <input type="number" name="purchase_hours" class="border p-2 w-full rounded" step="0.1" placeholder="e.g., 150.5">
    </div>
    <div>
        <label class="block font-medium">Current Miles (optional):</label>
        <input type="number" name="miles" class="border p-2 w-full rounded" step="0.1" placeholder="e.g., 35000">
    </div>
    <div id="hours_field" style="display: none;">
        <label class="block font-medium">Current Hours (optional):</label>
        <input type="number" name="hours" class="border p-2 w-full rounded" step="0.1" placeholder="e.g., 250.5">
    </div>
    <div>
        <label class="block font-medium">Vehicle Image (optional):</label>
        <div class="drag-drop-area" id="add-car-drop-zone" 
            ondrop="handleDrop(event, 'car_image')" 
            ondragover="handleDragOver(event)" 
            ondragleave="handleDragLeave(event)">
            <div class="drag-drop-content">
                <svg class="w-8 h-8 mx-auto mb-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                </svg>
                <p class="text-sm text-gray-600">Drag & drop vehicle image here or</p>
                <input type="file" id="car_image" name="image" accept="image/*" class="border p-2 w-full rounded mt-2">
            </div>
        </div>
        <p class="text-sm text-gray-600 mt-1">Accepted formats: PNG, JPG, JPEG, GIF, WEBP (max 16MB)</p>
    </div>

    <button type="submit" class="bg-gray-700 text-white px-4 py-2 rounded hover:bg-gray-800">Add Vehicle</button>
</form>

<script>
    function toggleHoursField() {
        const vehicleSelect = document.querySelector('select[name="vehicle_type"]');
        if (!vehicleSelect) return;
        
        const vehicleType = vehicleSelect.value;
        const hoursField = document.getElementById('hours-field');
        const milesField = document.querySelector('div:has(input[name="miles"])');
        const purchaseHoursField = document.getElementById('purchase_hours_field');
        const purchaseMileageField = document.querySelector('div:has(input[name="purchase_mileage"])');
        
        if (vehicleType === 'Boat') {
            // Show hours fields, hide miles fields
            hoursField.style.display = 'block';
            purchaseHoursField.style.display = 'block';
            milesField.style.display = 'none';
            purchaseMileageField.style.display = 'none';
        } else {
            // Show miles fields, hide hours fields
            hoursField.style.display = 'none';
            purchaseHoursField.style.display = 'none';
            milesField.style.display = 'block';
            purchaseMileageField.style.display = 'block';
        }
    }
    
    // Add event listener
    document.addEventListener('DOMContentLoaded', function() {
        const vehicleSelect = document.querySelector('select[name="vehicle_type"]');
        if (vehicleSelect) {
            vehicleSelect.addEventListener('change', toggleHoursField);
            toggleHoursField(); // Initialize on page load
        }
    });
</script>
{% endblock %}
